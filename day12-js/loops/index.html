<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //print number 1 to 10
        //console.log(1)
        //console.log(2)  //... 10 time

        //Start point and end point go for for loop
        //1. for(strating point; ending point/consition; increment/decrement)

        //print number 1 to 10
        for(let i = 1; i <= 10; i++){
            //body of for loop
            console.log("The value is ${i}")
        }

        //Rule : Condition is True loops starts and Condition is False loop Stop
        //while loop - entry contolled loop
        //while(condition)
        let count = 1
        while(count <= 5){
            console.log("Hello while loop")
            count++
        }

        //do while - it runs atleast for i time
        let number = 7
        do{
            alert("Hi i am a notification - pop op msg")
        }while(number = 7)

    </script>
</body>
</html>
